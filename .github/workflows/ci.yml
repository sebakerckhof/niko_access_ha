name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13
      - name: Create venv and install deps
        run: |
          uv venv
          # Test tooling, plus what Home Assistant's own ffmpeg and camera
          # components need.
          uv pip install ruff pytest-homeassistant-custom-component ha-ffmpeg PyTurboJPEG
          # The integration's requirements come from its manifest, as Home
          # Assistant installs them: a package missing there fails the tests.
          jq -r '.requirements[]' custom_components/niko_access/manifest.json \
            | uv pip install -r -
      - name: Ruff
        run: uv run ruff check custom_components tests
      - name: Pytest
        run: uv run pytest -q
